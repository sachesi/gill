name: Release

# A release tag gets a GitHub release once CI has passed (ci.yml calls this). The tag must
# agree with the version in Cargo.toml and Cargo.lock and with a section of CHANGELOG.md,
# whose text becomes the release's notes. The release carries the crates the build needs,
# for building without a network, and packages for Fedora, Debian, Ubuntu and Arch Linux.
# Run by hand, it publishes the given tag again.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v1.2.3
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source:
    name: Check the version and vendor the crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Check the version and write the notes
        run: |
          mkdir -p notes
          python3 - <<'EOF'
          import os, re, sys, tomllib

          tag = os.environ["TAG"].removeprefix("v")
          with open("Cargo.toml", "rb") as f:
              cargo = tomllib.load(f)["package"]["version"]
          with open("Cargo.lock", "rb") as f:
              lock = next(p["version"] for p in tomllib.load(f)["package"] if p["name"] == "gill")
          wrong = [f"{where} says {v}" for where, v in {"Cargo.toml": cargo, "Cargo.lock": lock}.items() if v != tag]
          with open("CHANGELOG.md") as f:
              section = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## |\Z)", f.read(), re.M | re.S)
          if section is None:
              wrong.append("CHANGELOG.md has no section for it")
          if wrong:
              sys.exit(f"The tag is {tag}, but " + ", ".join(wrong))
          with open("notes/notes.md", "w") as f:
              f.write(section.group(1).strip() + "\n")
          EOF
      - name: Vendor the crates
        run: |
          dir="gill-${TAG#v}"
          mkdir -p "$dir/.cargo" dist
          cargo vendor --locked --versioned-dirs "$dir/vendor" > "$dir/.cargo/config.toml"
          # Paths relative to the source tree, so the tarball unpacks over it.
          sed -i 's|^directory = .*|directory = "vendor"|' "$dir/.cargo/config.toml"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -cJf "dist/$dir-vendor.tar.xz" "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor
          path: dist/*

  fedora:
    name: Package for Fedora
    needs: source
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the tools
        run: dnf install -y --setopt=install_weak_deps=False git-core rpm-build dnf-plugins-core
      # The spec of this workflow's revision, which builds the tag's sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The spec's Source1, which the release is not yet there to serve.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendor
          path: rpmbuild/SOURCES
      - name: Build
        run: |
          spec=packaging/fedora/gill.spec
          sed -i "s/^Version:.*/Version:        ${TAG#v}/; s/^Release:.*/Release:        1%{?dist}/" "$spec"
          dnf builddep -y --setopt=install_weak_deps=False "$spec"
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" --define "_disable_source_fetch 0" "$spec"
          mkdir dist && mv rpmbuild/RPMS/*/*.rpm dist/
          # The dependencies resolve on the release it was built for.
          dnf install -y dist/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora
          path: dist/*

  debian:
    name: Package for ${{ matrix.name }}
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            image: debian:forky
            artifact: debian
            revision: "1"
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            artifact: ubuntu
            revision: 1~ubuntu26.04
    container: ${{ matrix.image }}
    env:
      REVISION: ${{ matrix.revision }}
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        # Not the image's sh, which is dash.
        shell: bash
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev \
            cargo rustc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Build
        run: |
          cargo build --locked --release
          install -Dm755 target/release/gill -t stage/usr/bin
          install -Dm644 LICENSE stage/usr/share/doc/gill/copyright
      - name: Package
        run: |
          strip --strip-unneeded stage/usr/bin/gill
          # dpkg-shlibdeps wants a source package to belong to.
          mkdir debian
          printf 'Source: gill\n\nPackage: gill\nArchitecture: any\n' > debian/control
          shlibs=$(dpkg-shlibdeps -O -e stage/usr/bin/gill | sed -n 's/^shlibs:Depends=//p')
          arch=$(dpkg --print-architecture)
          mkdir stage/DEBIAN
          cat > stage/DEBIAN/control <<EOF
          Package: gill
          Version: ${TAG#v}-$REVISION
          Architecture: $arch
          Maintainer: sachesi <xsachesi@pm.me>
          Installed-Size: $(du -sk stage | cut -f1)
          Depends: $shlibs, bash (>= 5.0), fish (>= 4.0)
          Section: shells
          Priority: optional
          Homepage: https://github.com/sachesi/gill
          Description: Run the bash lines fish cannot, and keep bash's state between them
           gill sends a line typed at the fish prompt to bash when fish cannot run it, such
           as a bash loop or an assignment. Exported variables and the working directory
           come back into fish, and bash's variables, functions, aliases and options last
           from one line to the next. Nothing changes until a user loads it from their fish
           configuration.
          EOF
          mkdir dist
          deb="dist/gill_${TAG#v}-${REVISION}_$arch.deb"
          dpkg-deb --root-owner-group -Zxz --build stage "$deb"
          # The dependencies resolve on the release it was built for.
          apt-get install -y "./$deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  arch:
    name: Package for Arch Linux
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The PKGBUILD of this workflow's revision, which builds the tag's sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          pacman -Syu --noconfirm --needed git
          useradd -m builder
          install -d -o builder pkg
          cp packaging/aur/PKGBUILD pkg/
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" pkg/PKGBUILD
          (source pkg/PKGBUILD && pacman -S --noconfirm --needed --asdeps "${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}")
          su builder -c 'cd pkg && makepkg --noconfirm'
          mkdir dist && mv pkg/"gill-${TAG#v}"-1-*.pkg.tar.zst dist/
          # The dependencies resolve on Arch as it is today.
          pacman -U --noconfirm dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: dist/*

  publish:
    name: Publish the release
    needs: [source, fedora, debian, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: notes
          name: notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{vendor,fedora,debian,ubuntu,arch}"
          merge-multiple: true
      - name: Publish
        run: |
          cd dist
          # GitHub turns the ~ of the Ubuntu revision into a dot in asset names; rename
          # first, so the checksums list the names people download.
          for f in *~*; do
            if [ -e "$f" ]; then mv "$f" "${f//\~/.}"; fi
          done
          sha256sum -- * > SHA256SUMS
          # A release that already exists keeps its notes, which may have been edited by hand.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber -- *
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "gill ${TAG#v}" \
              --notes-file ../notes/notes.md -- *
          fi

# Weekly pull requests for the actions the workflows use, pinned by commit, and for the
# crates in Cargo.lock. Minor and patch updates of crates come as one pull request, a
# week after release, so a bad version has time to be yanked.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      crates:
        update-types: [minor, patch]
